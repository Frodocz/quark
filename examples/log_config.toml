[server]
host = "127.0.0.1"
port = 8080

# Two logging profiles, picked by section name: quark::ScopedLog{cfg, "log_hft"}. A deployment
# normally keeps one, as [log], read by quark::ScopedLog{cfg}.
#
# Backend keys of a profile table:
#   manual_backend           drive the backend from a quark::LogPoller (default false)
#   cpu_affinity             cores of quill's backend thread (default [], unpinned)
#   backend_sleep_ns         idle sleep of quill's backend thread (default 100000, 0 busy-polls)
#   backend_yield_when_idle  only with backend_sleep_ns = 0: yield instead of spinning
# The queue type, capacity and huge pages are build options: -DQUARK_LOG_QUEUE_TYPE=...,
# -DQUARK_LOG_INITIAL_QUEUE_CAPACITY=<bytes>, -DQUARK_LOG_HUGE_PAGES=ON|OFF.
#
# One sub-table per logger, the table name is the logger name: quark::get_logger("app").
#   level, to_console, to_rotating_file, pattern, filename (default logs/<name>.log),
#   max_file_size_bytes, max_backup_files, daily_rotation_time
# Loggers without a table get the defaults. [quark] configures quark's own logger.

# HFT: the process polls the backend on its own housekeeping thread.
[log_hft]
manual_backend = true

[log_hft.quark]
level = "Warn"
to_console = false

[log_hft.app]
level = "Info"
to_console = false
pattern = "%(time) [%(thread_id)] %(log_level:<9) %(logger:<8) %(message)"

[log_hft.net]
level = "Warn"
to_console = false
max_file_size_bytes = 268435456
max_backup_files = 20

# Services: quill's backend thread, sleeping when idle.
[log_service]
backend_sleep_ns = 100000

[log_service.quark]
level = "Info"

[log_service.app]
level = "Info"
pattern = "%(time) [%(thread_id)] %(log_level:<9) %(logger:<8) %(message)"

[log_service.net]
level = "Warn"
to_console = false
max_file_size_bytes = 67108864
max_backup_files = 5
